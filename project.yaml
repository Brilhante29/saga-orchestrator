id: 16
name: saga-orchestrator
program:
  id: backend-reliability-platform
  narrative_fit: demonstra transacoes distribuidas com compensacao via saga pattern
  shared_assets: []
status: implemented
claim: transacoes distribuidas com compensacao
stack:
  - java21
  - spring-boot
  - postgresql
  - docker
  - gradle
language_profile:
  primary: spring-kotlin-backend
  secondary: []
  reason: Java/Spring Boot is the primary backend stack for demonstrating saga orchestration with compensation patterns
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: domain does not depend on framework, database, broker, cloud SDK, transport, or UI
    solid:
      - srp
      - ocp
      - lsp
      - isp
      - dip
    simplicity_rule: minimal implementation that proves distributed transactions with compensation
    testability_rule: saga orchestrator tested without Spring context via pure domain POJOs
    rejected_overengineering:
      - message broker (Kafka/RabbitMQ) not needed for single-node saga proof
      - distributed database not needed for in-memory benchmark
      - container orchestration (Kubernetes) not needed for single-container demo
  stack_profile: spring-kotlin-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: docker
    real_provider_target: none
    emulated_services: []
    adapter_rule: ports/adapters keep cloud SDK outside domain/use cases
    config_switch: none
    unsupported_behaviors: []
  database: postgresql
  runtime: docker
  library_policy: Spring Boot 3.4 for REST support, pure Java for domain logic, Jackson for JSON output
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: spring-kotlin-backend with Kotlin
      reason: Java is sufficient; Kotlin adds compilation overhead without benefit for this benchmark
    - option: Kafka/RabbitMQ for async saga
      reason: synchronous saga is simpler and proves compensation pattern equally well
architecture:
  style: layered
  reason: Saga orchestration maps naturally to domain/application/infrastructure layers; domain has zero framework dependency
  problem_forces:
    domain_complexity: medium
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: medium
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: domain does not import application or infrastructure; application depends on domain
  boundaries:
    - domain: saga core entities, interfaces, orchestrator
    - application: REST controller, in-memory saga log
    - steps: step implementations with simulated success/failure
    - benchmark: runner and result schema
  rejected_alternatives:
    - style: event-driven
      reason: adds message broker complexity without improving compensation proof
    - style: hexagonal
      reason: overengineering for a single-benchmark project
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: consistency_rate
  unit: unit
  command: docker run --rm saga-orchestrator
  result_path: benchmarks/results/*.json
release:
  docker: done
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
