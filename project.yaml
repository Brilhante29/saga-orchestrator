manifest_version: 2
id: 16
name: saga-orchestrator
program:
  id: backend-reliability-platform
  narrative_fit: durable orchestration and compensation between the payment, order, outbox and cache portfolio repositories
  shared_assets:
    - contracts/commerce-event-v1.schema.json
status: benchmarked
claim: durable synchronous saga recovery with idempotent PostgreSQL operations and compensations
stack:
  - kotlin-2.1
  - java-21
  - spring-boot-3.4
  - spring-webmvc
  - spring-jdbc
  - postgresql-17.6
  - flyway
  - testcontainers
  - gradle-8.10.2
  - docker-compose
language_profile:
  primary: spring-kotlin-backend
  secondary: []
  reason: Kotlin makes state transitions explicit while Spring JDBC keeps transaction boundaries visible
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-compose
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: domain depends only on SagaStore and SagaStep ports
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: synchronous orchestration; no broker and no two-phase commit
    testability_rule: the same orchestrator runs with in-memory test doubles and PostgreSQL adapters
    rejected_overengineering:
      - Kafka or RabbitMQ without an asynchronous delivery claim
      - WebFlux over blocking JDBC
      - ORM for explicit state-transition SQL
  stack_profile: spring-kotlin-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: docker-compose
    real_provider_target: managed-postgresql
    emulated_services: []
    adapter_rule: database implementation remains behind SagaStore and SagaStep ports
    config_switch: DB_URL
    unsupported_behaviors:
      - multi-region failover
  database: postgresql
  runtime: docker
  library_policy: Spring JDBC and Flyway expose transaction and migration behavior without ORM indirection
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Java-only core
      reason: Kotlin exhaustive enum handling improves the state-machine implementation
    - option: Kafka or RabbitMQ
      reason: the selected synchronous orchestration does not require message delivery
    - option: JPA
      reason: explicit SQL makes idempotency and locking inspectable
architecture:
  style: hexagonal
  reason: orchestration depends on small persistence and step ports with PostgreSQL at the edge
  problem_forces:
    domain_complexity: high
    integration_pressure: medium
    ui_state_complexity: none
    data_or_ml_reproducibility: none
    auditability: high
    throughput_or_async: low
    independent_deployability: low
  dependency_rule: adapters depend inward on framework-free Kotlin domain contracts
  boundaries:
    - domain: saga state, ports, failure plan and orchestrator
    - application: REST adapter and benchmark command
    - infrastructure: JDBC saga store and idempotent order-step adapters
    - contracts: versioned commerce event envelope
  rejected_alternatives:
    - style: event-driven
      reason: broker delivery is outside the synchronous recovery claim
    - style: layered-with-in-memory-state
      reason: process restart would erase the evidence
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components: [readme_header, benchmark_card, architecture_card, references_table]
  diagram_required: true
reuse:
  kit_version: local
  uses: [catalog, programs, openspec-schema, decision-brain, agent-graph, architecture, language-profiles, sdd, harness, skills]
benchmark:
  schema_version: 2
  benchmark_id: durable-failure-matrix
  primary_metric: consistency_rate
  secondary_metric: uncompensated_sagas
  unit: ratio
  repetitions: 3
  command: docker compose --profile tools run --rm --build benchmark
  result_path: benchmarks/results/saga-reliability-v2.json
release:
  docker: done
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
  broker_claim: none
