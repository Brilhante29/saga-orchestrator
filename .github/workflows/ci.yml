name: CI

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main, "codex/**", "agent/**"]

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4
      - name: Test with PostgreSQL Testcontainers
        run: ./gradlew clean test --no-daemon
      - name: Install benchmark schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Validate repository contracts
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
      - name: Build runtime image
        run: docker build -t saga-orchestrator .

  benchmark:
    runs-on: ubuntu-latest
    needs: test-and-validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build benchmark image
        run: docker compose build app
      - name: Run current failure matrix
        run: |
          IMAGE_DIGEST="$(docker image inspect saga-orchestrator:local --format '{{.Id}}')"
          SOURCE_COMMIT="$GITHUB_SHA" SOURCE_TREE_CLEAN=true IMAGE_DIGEST="$IMAGE_DIGEST" \
            docker compose --profile tools run --rm benchmark
      - name: Validate benchmark v2
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python tools/validate-json-schema.py \
            .portfolio/contracts/benchmark-result-v2.schema.json \
            benchmarks/results/saga-reliability-v2.json
      - name: Upload generated evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: saga-reliability-v2-${{ github.sha }}
          path: benchmarks/results/saga-reliability-v2.json
          if-no-files-found: error
      - name: Stop local-first runtime
        if: always()
        run: docker compose --profile tools down -v
